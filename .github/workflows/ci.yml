# Runs the linter and unit tests on every pull request to main.
# Based on https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-nodejs -Trent
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
